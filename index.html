<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor</title>
<!-- GESTOR — painel interno, v1.8 (TI, 25–29/09/2026). Aba METAS: desenho em metas.js, números do banco (v_meta_real,
     v_decisao_vigente), modelo aprovado por ele em 29/09. O nome é dele: "portal de consulta de carteira é UMA das coisas que vai ter
     dentro; vamos botar um nome que não bloqueia a mente". Só LEITURA.
     Publicado em repositório PÚBLICO (GitHub Pages): aqui só HTML/CSS/JS e a chave publicável — nada de segredo, caminho de
     máquina ou nome real de cliente em exemplo. Login com e-mail e senha (Auth do Supabase); sem login não vê nada.
     DUAS ABAS (ordem dele, 26/09): CARTEIRA (faturado + carteira por produto e mês, da base dele) e GIRO (venda e estoque por
     produto e mês, das análises de giro). Mesmos filtros; cada aba tem a sua cobertura de meses e diz quando não há carga —
     tabela vazia é armadilha. Mostra a data da base que gerou cada número.
     O que NÃO tem, de propósito: voz (o ditado do iPhone no campo já serve), qualquer escrita (cancelar/transferir é outro projeto),
     gráfico. Os marcadores https://bdkazfzgecbhmiewfmjb.supabase.co e sb_publishable_uR4m8_xLpYp-E3APKhzeHg_6gNOHuaB são preenchidos por publica_portal.py (a chave publicável é feita
     para ficar na página; o que protege o dado é a política por linha, não a chave). -->
<style>
:root{--bg:#0b0c10;--card:#16171f;--ink:#f5f6f8;--mu:#8b8f99;--acc:#36c47a;--ruim:#d9534f;--bd:#2a2c36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:1.1rem;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
input,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0f1015;color:var(--ink)}
.linha{display:flex;gap:10px}.linha>div{flex:1}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#0b0c10;font-weight:800;margin-top:14px}
button.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:600}
.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:.95rem}
.msg.aviso{background:#3a2a10;color:#ffd54a}.msg.erro{background:#3a1616;color:#ff9a9a}.msg.ok{background:#12301f;color:#9be7b8}
table{width:100%;border-collapse:collapse;margin-top:4px;font-size:.82rem}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--bd);vertical-align:top;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--acc)}
.mu{color:var(--mu);font-size:.8rem}
.pe{color:var(--mu);font-size:.75rem;margin-top:16px}
/* ordem dele (26/09, no celular): um número por célula, uma linha só; a COR diz o que é — verde claro = faturado, verde escuro = carteira */
td.fat{background:#245c3d;color:#dff5e7;font-weight:700}
td.cart{background:#0f3a24;color:#9be7b8}
td.mix{background:linear-gradient(90deg,#245c3d 50%,#0f3a24 50%);color:#dff5e7;font-weight:700}
/* giro: venda em verde claro (é venda), estoque em azul — cores diferentes para o olho não confundir com a carteira */
td.est{background:#1f3d5c;color:#d6e8ff;font-weight:700}
.legenda{font-size:.75rem;color:var(--mu);margin:6px 0 0}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 10px}
.oculto{display:none}
/* abas e o seletor venda/estoque: botões pequenos, lado a lado */
.abas,.seletor{display:flex;gap:8px;margin:0 0 12px}
.abas button,.seletor button{margin:0;padding:10px;background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:700}
.abas button.ativa,.seletor button.ativa{background:var(--acc);color:#0b0c10;border-color:var(--acc)}
.seletor{margin:10px 0 0}.seletor button{padding:8px;font-size:.85rem}
/* ordem dele (28/09): filtro de cliente por NOME, um toque — nada de digitar no celular */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.chips button{width:auto;margin:0;padding:9px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1px solid var(--bd);font-weight:600;font-size:.85rem}
.chips button.ativa{background:var(--acc);color:#0b0c10;border-color:var(--acc)}
/* ---- METAS: o modelo aprovado por ele em 29/09 (ATA 23/09). Painel claro dentro do app escuro: as cores do modelo são as dele. ---- */
.metas{background:#fff;color:#1c1814;border-radius:14px;padding:14px 12px 12px;font-size:13px;--cmsF:#1a6fd6;--vendF:#0f9f6a;--cmsP:#85B7EB;--vendP:#9FE1CB;--ouro:#eda100;--mu2:#7c7268;--bd2:#d9d2c6;--gl2:#ebe7df}
.metas .cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}.metas h2{font-size:15px;margin:0;font-weight:800}.metas .per{color:var(--mu2);font-size:12px}
.metas .leg{display:flex;gap:14px;font-size:11px;color:var(--mu2);margin-left:auto}.metas .leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}.metas .lc{background:var(--cmsF)}.metas .lv{background:var(--vendF)}
.metas .grade{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:end}
.metas .tot{padding-right:8px;border-right:1.5px solid var(--bd2);position:relative}
.metas .bars{height:200px;display:flex;align-items:flex-end;justify-content:center;gap:6px;position:relative}.metas .tot .bars{gap:9px}
.metas .nome{text-align:center;font-size:9.5px;color:var(--mu2);line-height:1.15;margin-top:4px;min-height:22px}.metas .col.foco .nome{color:#1c1814;font-weight:800}.metas .col.abandonado .nome{opacity:.45}
.metas .cur{display:none}
.metas .pop{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 4px);background:#1c1814;color:#fff;font-size:10px;padding:5px 7px;border-radius:7px;white-space:nowrap;z-index:5;line-height:1.5}
.metas .pop .cms{color:#85B7EB;display:block}.metas .pop .vend{color:#9FE1CB;display:block}.metas .col.aberta .pop{display:block}
.metas .col{cursor:pointer}
.metas .b.vazia{height:0;border-top:2px dotted var(--mu2);width:15px;background:none}
.metas .rot100{position:absolute;right:4px;top:-13px;font-size:9px;color:#b0281f;font-weight:700;background:#fff;padding:0 3px}
.metas .medida{color:#1c1814}.metas.futuro .medida{color:#7c4dff}
.metas .cb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:15px}
.metas .b{width:15px;border-radius:3px 3px 0 0;transform-origin:bottom;animation:sobe 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.metas .b.cms{background:var(--cmsP)}.metas .b.vend{background:var(--vendP)}
.metas .col.foco .b.cms,.metas .tot .b.cms{background:var(--cmsF)}.metas .col.foco .b.vend,.metas .tot .b.vend{background:var(--vendF)}
.metas .b.ouro{background:var(--ouro)!important;box-shadow:0 0 10px 1px rgba(237,161,0,.45)}
.metas .b.neg{position:absolute;left:0;right:0;top:100%;background:#d9534f;border-radius:0 0 3px 3px;transform-origin:top}
.metas .col.abandonado .b{opacity:.28;filter:grayscale(1)}
.metas .area{position:relative}.metas .gr{position:absolute;left:0;right:0;border-top:1px solid var(--gl2)}.metas .gr.cem{border-top:1.5px dashed #6b6560}
.metas .area .gr{bottom:auto}.metas .area .gr:nth-child(1){top:0}.metas .area .gr:nth-child(2){top:67px}.metas .area .gr:nth-child(3){top:133px}.metas .area .gr:nth-child(4){top:200px}
.metas .cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}.metas .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.metas .faixa{display:grid;grid-template-columns:76px minmax(0,1fr);margin-top:4px;border-top:1px solid var(--bd2)}.metas .faixa .lin{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.metas .faixa .c{text-align:center;font-variant-numeric:tabular-nums;padding:2px 1px;white-space:nowrap;min-width:0;font-size:11.5px}.metas .faixa .r{display:contents}
.metas .faixa .tc{text-align:center;font-variant-numeric:tabular-nums;padding:2px 3px;font-size:11.5px;border-right:1.5px solid var(--bd2);grid-column:1}
.metas .met.cms{color:var(--cmsF)}.metas .met.vend{color:var(--vendF)}.metas .met{font-weight:600}
.metas .fal.cms{background:#e9f1fb;color:var(--cmsF)}.metas .fal.vend{background:#e6f6ef;color:var(--vendF)}.metas .fal.excedente{color:#0f9f6a;font-weight:800}
.metas .c.abandonado{opacity:.5}
.metas .pe{color:var(--mu2);font-size:10.5px;margin:10px 0 0}
@media (max-width:600px){.metas .grade,.metas .faixa{grid-template-columns:52px minmax(0,1fr)}.metas .b,.metas .cb{width:10px}.metas .bars{gap:3px}.metas .tot .bars{gap:6px}
  .metas .longo{display:none}.metas .cur{display:inline}.metas .faixa .r.meta{display:none}.metas .faixa .c,.metas .faixa .tc{font-size:11px;padding:3px 1px}.metas .nome{font-size:9px}}
@media (prefers-reduced-motion:reduce){.metas .b{animation:none}}
</style>
</head>
<body>
<h1>Gestor <span class="mu" style="font-weight:600" id="subtitulo">· quantos pares?</span></h1>

<div id="tela-login" class="card oculto">
  <label>e-mail</label><input id="email" type="email" autocomplete="username" inputmode="email">
  <label>senha</label><input id="senha" type="password" autocomplete="current-password">
  <button id="bt-entrar">Entrar</button>
  <button id="bt-esqueci" class="sec">Esqueci a senha</button>
  <div id="msg-login"></div>
</div>

<div id="tela-senha" class="card oculto">
  <p>Defina a sua senha para o Gestor.</p>
  <label>nova senha (mínimo 8)</label><input id="senha-nova" type="password" autocomplete="new-password">
  <button id="bt-definir">Salvar senha e entrar</button>
  <div id="msg-senha"></div>
</div>

<div id="tela-pergunta" class="oculto">
  <div class="abas">
    <button data-aba="carteira" class="ativa">Carteira</button>
    <button data-aba="giro">Análise de giro</button>
    <button data-aba="metas">Metas</button>
  </div>
  <div id="tela-metas" class="oculto">
    <div class="card" style="padding:10px 14px"><label>mês</label><div class="chips" id="chips-mes"></div></div>
    <div id="metas-painel"></div>
  </div>
  <div class="card" id="filtros">
    <label>cliente</label>
    <div class="chips" id="chips-cliente"></div>
    <label>produto (referência ou nome; vazio = todos)</label><input id="produto" placeholder="ex.: nome do tênis ou referência" autocapitalize="characters">
    <div class="linha">
      <div><label>de (mês)</label><input id="de" type="month"></div>
      <div><label>até (mês)</label><input id="ate" type="month"></div>
    </div>
    <button id="bt-perguntar">Perguntar</button>
    <div id="msg-pergunta"></div>
    <div class="mu" id="cobertura" style="margin-top:10px"></div>
  </div>
  <div id="resultado"></div>
  <p class="pe" id="rodape"></p>
  <p class="pe"><a href="#" id="bt-sair" style="color:var(--mu)">sair</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="metas.js?v=20"></script>
<script>
const URL_SB = "https://bdkazfzgecbhmiewfmjb.supabase.co", CHAVE = "sb_publishable_uR4m8_xLpYp-E3APKhzeHg_6gNOHuaB";
const sb = supabase.createClient(URL_SB, CHAVE);
const $ = id => document.getElementById(id);
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmt = n => Number(n).toLocaleString("pt-BR");
const mesBR = iso => { const [a,m] = iso.slice(0,7).split("-"); return MESES[+m-1] + "/" + a.slice(2); };
const dmy = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
function msg(id, texto, tipo){ $(id).innerHTML = texto ? `<div class="msg ${tipo||"aviso"}">${texto}</div>` : ""; }
function mostrar(tela){ for (const t of ["tela-login","tela-senha","tela-pergunta"]) $(t).classList.toggle("oculto", t !== tela); }

// ---------- sessão
async function arranque(){
  const hash = new URLSearchParams(location.hash.slice(1));
  const { data: { session } } = await sb.auth.getSession();
  if (session && (hash.get("type") === "invite" || hash.get("type") === "recovery")) { mostrar("tela-senha"); return; }
  if (session) { mostrar("tela-pergunta"); await prepararPergunta(); return; }
  mostrar("tela-login");
}
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === "PASSWORD_RECOVERY") mostrar("tela-senha");
  else if (evento === "SIGNED_OUT") mostrar("tela-login");
});
$("bt-entrar").onclick = async () => {
  msg("msg-login", "");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  if (error) { msg("msg-login", "Não entrou: " + traduz(error.message), "erro"); return; }
  mostrar("tela-pergunta"); await prepararPergunta();
};
$("bt-esqueci").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) { msg("msg-login", "Escreva o e-mail primeiro.", "aviso"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  msg("msg-login", error ? "Não consegui: " + traduz(error.message) : "Se o e-mail tiver login, chegou um link para definir a senha.", error ? "erro" : "ok");
};
$("bt-definir").onclick = async () => {
  const s = $("senha-nova").value;
  if (s.length < 8) { msg("msg-senha", "Mínimo 8 caracteres.", "erro"); return; }
  const { error } = await sb.auth.updateUser({ password: s });
  if (error) { msg("msg-senha", "Não salvou: " + traduz(error.message), "erro"); return; }
  history.replaceState(null, "", location.pathname);
  mostrar("tela-pergunta"); await prepararPergunta();
};
$("bt-sair").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); mostrar("tela-login"); };
function traduz(m){ return ({"Invalid login credentials":"e-mail ou senha errados","Email not confirmed":"e-mail ainda não confirmado"})[m] || m; }

// ---------- as abas
// Cada aba tem a sua fonte, a sua cobertura de meses e o seu rodapé. Os filtros são os mesmos.
const ABAS = {
  carteira: { subtitulo: "· quantos pares?", visao_cob: "v_cobertura", cob: [],
              rodape: "Carteira: verde claro = faturado no mês; verde escuro = em carteira, previsto para o mês. Da base dele, por cliente (lojas somadas)." },
  giro:     { subtitulo: "· análise de giro", visao_cob: "v_cobertura_giro", cob: [],
              rodape: "Giro: venda e estoque do cliente por produto e mês, das análises de giro. A Casa Pio não entrega por cor. Célula vazia (—) = a AG não tem o dado; 0 = vendeu zero." },
  metas:    { subtitulo: "· metas", visao_cob: null, cob: [], rodape: "" },        // nenhum texto explicativo na tela (ATA 23/09)
};
let MES_METAS = null;
async function mostrarMetas(){
  const el = $("metas-painel"); el.innerHTML = `<div class="msg ok">buscando…</div>`;
  const d = await Metas.carregar(sb, MES_METAS);
  const meses = d.meses || [];
  // SET · OUT · NOV · DEZ, abrindo no mês corrente (pedido dele, 29/09); à frente é carteira, não real
  $("chips-mes").innerHTML = meses.map(m => `<button type="button" data-mes="${m}" class="${m === (d.mes || MES_METAS) ? "ativa" : ""}">${MESES[+m.slice(5,7)-1].toUpperCase()}</button>`).join("");
  for (const b of document.querySelectorAll("#chips-mes button")) b.onclick = () => { MES_METAS = b.dataset.mes; mostrarMetas(); };
  Metas.desenhar(el, d);
}
let ABA = "carteira";
let MEDIDA_GIRO = "venda";         // o que a célula do giro mostra: venda ou estoque (um número por célula, ordem dele)
let ULTIMO_GIRO = null;            // último resultado do giro, para trocar venda/estoque sem ir ao banco de novo
function trocarAba(nova){
  ABA = nova;
  for (const b of document.querySelectorAll(".abas button")) b.classList.toggle("ativa", b.dataset.aba === nova);
  $("subtitulo").textContent = ABAS[nova].subtitulo;
  $("rodape").textContent = ABAS[nova].rodape;
  $("resultado").innerHTML = ""; msg("msg-pergunta", "");
  const metas = nova === "metas";
  $("tela-metas").classList.toggle("oculto", !metas); $("filtros").classList.toggle("oculto", metas); $("resultado").classList.toggle("oculto", metas);
  if (metas) { mostrarMetas(); return; }
  mostrarCobertura();
}
for (const b of document.querySelectorAll(".abas button")) b.onclick = () => trocarAba(b.dataset.aba);
function mostrarCobertura(){
  const cob = ABAS[ABA].cob;
  $("cobertura").textContent = cob.length ? "meses com carga no banco: " + cob.map(mesBR).join(", ") : "o banco ainda não tem carga nenhuma nesta aba";
}

// ---------- a pergunta
// A API devolve no máximo 1.000 linhas por pedido, EM SILÊNCIO (26/09: set–dez "sumiram"). Tudo se lê em páginas até acabar.
async function tudo(consulta){
  const PAG = 1000; let de = 0, out = [];
  for (;;) {
    const { data, error } = await consulta.range(de, de + PAG - 1);
    if (error) return { data: out, error };
    out = out.concat(data || []);
    if (!data || data.length < PAG) return { data: out, error: null };
    de += PAG;
  }
}
async function prepararPergunta(){
  const nomes = new Set();
  for (const a of Object.values(ABAS)) {
    if (!a.visao_cob) continue;
    const { data: cob } = await tudo(sb.from(a.visao_cob).select("cliente,mes").order("mes").order("cliente"));
    for (const r of cob || []) nomes.add(r.cliente);
    a.cob = [...new Set((cob||[]).map(r => r.mes.slice(0,7)))].sort();
  }
  montarChips([...nomes].sort());
  // período padrão: o SEMESTRE do último mês carregado (ordem dele, 26/09: "o semestre dividindo os meses por colunas")
  const cob = ABAS.carteira.cob.length ? ABAS.carteira.cob : ABAS.giro.cob;
  if (cob.length && !$("de").value) {
    const ult = cob[cob.length - 1], ano = ult.slice(0, 4), m = +ult.slice(5, 7);
    $("de").value = ano + (m <= 6 ? "-01" : "-07"); $("ate").value = ano + (m <= 6 ? "-06" : "-12");
  }
  trocarAba(ABA);
}
// filtro de cliente: um botão por nome que existe no banco (das duas abas) + "todos"; um toque seleciona, outro toque no mesmo solta
let CLIENTE_SEL = "";
function montarChips(nomes){
  const todos = ["", ...nomes];
  $("chips-cliente").innerHTML = todos.map(n => `<button type="button" data-cli="${n}" class="${n === CLIENTE_SEL ? "ativa" : ""}">${n || "todos"}</button>`).join("");
  for (const b of document.querySelectorAll("#chips-cliente button")) b.onclick = () => {
    CLIENTE_SEL = (b.dataset.cli === CLIENTE_SEL) ? "" : b.dataset.cli;
    for (const x of document.querySelectorAll("#chips-cliente button")) x.classList.toggle("ativa", x.dataset.cli === CLIENTE_SEL);
  };
}
function mesesEntre(de, ate){
  const out = []; let [a,m] = de.split("-").map(Number); const [a2,m2] = ate.split("-").map(Number);
  while (a < a2 || (a === a2 && m <= m2)) { out.push(a + "-" + String(m).padStart(2,"0")); m++; if (m > 12) { m = 1; a++; } }
  return out;
}
// valida o período contra a cobertura da aba; devolve {pedidos, semCarga} ou null (já avisou)
function periodo(){
  const de = $("de").value, ate = $("ate").value, cob = ABAS[ABA].cob;
  if (!de || !ate || de > ate) { msg("msg-pergunta", "Período inválido: escolha de e até (o de não pode ser depois do até).", "erro"); return null; }
  const pedidos = mesesEntre(de, ate);
  const semCarga = pedidos.filter(m => !cob.includes(m));
  if (semCarga.length === pedidos.length) {
    msg("msg-pergunta", `<b>Não há carga no banco para ${semCarga.map(mesBR).join(", ")}.</b> Meses carregados nesta aba: ${cob.map(mesBR).join(", ") || "nenhum"}. O número não existe aqui — não é zero.`, "aviso");
    return null;
  }
  if (pedidos.length > 12) { msg("msg-pergunta", "Período de até 12 meses por consulta.", "erro"); return null; }
  return { de, ate, pedidos, semCarga, cob };
}
$("bt-perguntar").onclick = () => (ABA === "giro" ? perguntarGiro() : perguntarCarteira());

// ---------- CARTEIRA
async function perguntarCarteira(){
  msg("msg-pergunta", ""); $("resultado").innerHTML = "";
  const p = periodo(); if (!p) return;
  const { de, ate, pedidos, semCarga, cob } = p;
  const cliente = CLIENTE_SEL, produto = $("produto").value.trim();
  msg("msg-pergunta", "buscando…", "ok");
  // por cliente, lojas somadas (ordem dele, 25/09: "não coloca por porta ainda") — a loja fica no banco, pronta
  let q = sb.from("v_venda_produto_mes").select("mes,cliente,referencia,cor,descricao,pares_fat,pares_cart,base_em")
            .gte("mes", de + "-01").lte("mes", ate + "-01").order("mes").order("cliente").order("referencia").order("cor");
  if (cliente) q = q.eq("cliente", cliente);
  if (produto) q = q.or(`referencia.ilike.%${produto}%,descricao.ilike.%${produto}%`);
  const { data, error } = await tudo(q);
  if (error) { msg("msg-pergunta", "O banco recusou: " + error.message, "erro"); return; }
  msg("msg-pergunta", "");
  const avisos = [];
  if (semCarga.length) avisos.push(`sem carga para ${semCarga.map(mesBR).join(", ")} — esses meses NÃO estão na soma`);
  if (!data.length) { msg("msg-pergunta", `Nenhuma linha para ${cliente||"todos"} × ${produto||"todos"} nos meses carregados (${pedidos.filter(m=>cob.includes(m)).map(mesBR).join(", ")}). ${avisos.join("; ")}`, "aviso"); return; }
  // ORDEM DELE (26/09): uma linha por PRODUTO — referência, nome e cor em colunas separadas — e os MESES em colunas.
  // Lojas somadas (por cliente). Célula = UM número (faturado + carteira); a cor diz o que é. Mês sem carga = "s/ carga", nunca zero.
  const colunas = pedidos;
  const g = new Map();
  for (const r of data) {
    const k = [r.cliente, r.referencia, r.descricao || "", r.cor].join("|");
    const a = g.get(k) || { cliente: r.cliente, referencia: r.referencia, descricao: r.descricao || "", cor: r.cor, meses: {}, tot_fat: 0, tot_cart: 0 };
    const m = r.mes.slice(0, 7);
    const c = a.meses[m] || { fat: 0, cart: 0 };
    c.fat += r.pares_fat; c.cart += r.pares_cart; a.meses[m] = c; a.tot_fat += r.pares_fat; a.tot_cart += r.pares_cart;
    g.set(k, a);
  }
  const linhas = [...g.values()].sort((x, y) => (x.cliente.localeCompare(y.cliente)) || (y.tot_fat - x.tot_fat));
  const totF = linhas.reduce((s, r) => s + r.tot_fat, 0), totC = linhas.reduce((s, r) => s + r.tot_cart, 0);
  const totMes = {}, totMesC = {};
  for (const m of colunas) { totMes[m] = linhas.reduce((s, r) => s + ((r.meses[m] || {}).fat || 0), 0); totMesC[m] = linhas.reduce((s, r) => s + ((r.meses[m] || {}).cart || 0), 0); }
  const bases = [...new Set(data.map(r => r.base_em))].sort();
  const muitosClientes = new Set(linhas.map(r => r.cliente)).size > 1;
  const celula = (fat, cart) => {
    const v = fat + cart;
    if (!v) return `<td class="n mu">0</td>`;
    const cls = fat && cart ? "mix" : (fat ? "fat" : "cart");
    return `<td class="n ${cls}">${fmt(v)}</td>`;
  };
  let html = `<div class="card"><b>${fmt(totF)} faturados</b> · <b>${fmt(totC)} em carteira</b> — ${linhas.length} produto(s) · base de ${bases.map(dmy).join(" e ")}` +
             `<div class="legenda"><i style="background:#245c3d"></i>faturado <i style="background:#0f3a24"></i>carteira</div>${avisos.length ? `<div class="msg aviso">${avisos.join("; ")}</div>` : ""}</div>`;
  html += `<div class="card" style="overflow-x:auto;padding:8px"><table><thead><tr>${muitosClientes ? "<th>cliente</th>" : ""}<th>ref.</th><th>nome</th><th>cor</th>`;
  for (const m of colunas) html += `<th class="n">${mesBR(m)}</th>`;
  html += `<th class="n">total</th></tr></thead><tbody>`;
  for (const r of linhas) {
    html += `<tr>${muitosClientes ? `<td>${r.cliente}</td>` : ""}<td class="mu">${r.referencia}</td><td>${r.descricao}</td><td>${r.cor}</td>`;
    for (const m of colunas) {
      if (!cob.includes(m)) { html += `<td class="n mu">s/ carga</td>`; continue; }
      const c = r.meses[m] || { fat: 0, cart: 0 };
      html += celula(c.fat, c.cart);
    }
    html += celula(r.tot_fat, r.tot_cart) + `</tr>`;
  }
  html += `<tr class="tot">${muitosClientes ? "<td></td>" : ""}<td colspan="3">total</td>`;
  for (const m of colunas) html += cob.includes(m) ? celula(totMes[m], totMesC[m]) : `<td class="n">—</td>`;
  html += celula(totF, totC) + `</tr></tbody></table></div>`;
  $("resultado").innerHTML = html;
}

// ---------- GIRO (ordem dele, 26/09: "uma outra aba como análise de giro… venda e estoque desses clientes, julho a dezembro")
async function perguntarGiro(){
  msg("msg-pergunta", ""); $("resultado").innerHTML = ""; ULTIMO_GIRO = null;
  const p = periodo(); if (!p) return;
  const { de, ate, pedidos, semCarga, cob } = p;
  const cliente = CLIENTE_SEL, produto = $("produto").value.trim();
  msg("msg-pergunta", "buscando…", "ok");
  let q = sb.from("v_giro_produto_mes").select("mes,cliente,referencia,cor,descricao,venda,estoque,base_em")
            .gte("mes", de + "-01").lte("mes", ate + "-01").order("mes").order("cliente").order("referencia").order("cor");
  if (cliente) q = q.eq("cliente", cliente);
  if (produto) q = q.or(`referencia.ilike.%${produto}%,descricao.ilike.%${produto}%`);
  const { data, error } = await tudo(q);
  if (error) { msg("msg-pergunta", "O banco recusou: " + error.message, "erro"); return; }
  msg("msg-pergunta", "");
  const avisos = [];
  if (semCarga.length) avisos.push(`sem giro para ${semCarga.map(mesBR).join(", ")} — o giro de um mês sobe quando o mês fecha`);
  if (!data.length) { msg("msg-pergunta", `Nenhuma linha de giro para ${cliente||"todos"} × ${produto||"todos"} nos meses carregados (${pedidos.filter(m=>cob.includes(m)).map(mesBR).join(", ")}). ${avisos.join("; ")}`, "aviso"); return; }
  // uma linha por produto (cliente, ref, nome, cor — a Casa Pio vem sem cor); meses em colunas; célula = venda OU estoque (seletor)
  const g = new Map();
  for (const r of data) {
    const k = [r.cliente, r.referencia, r.descricao || "", r.cor].join("|");
    const a = g.get(k) || { cliente: r.cliente, referencia: r.referencia, descricao: r.descricao || "", cor: r.cor, meses: {}, tot_venda: 0 };
    a.meses[r.mes.slice(0, 7)] = { venda: r.venda, estoque: r.estoque };
    a.tot_venda += r.venda || 0;
    g.set(k, a);
  }
  const linhas = [...g.values()].sort((x, y) => (x.cliente.localeCompare(y.cliente)) || (y.tot_venda - x.tot_venda));
  ULTIMO_GIRO = { linhas, colunas: pedidos, cob, avisos, bases: [...new Set(data.map(r => r.base_em))].sort() };
  desenharGiro();
}
function desenharGiro(){
  const { linhas, colunas, cob, avisos, bases } = ULTIMO_GIRO;
  const med = MEDIDA_GIRO, cls = med === "venda" ? "fat" : "est";
  const muitosClientes = new Set(linhas.map(r => r.cliente)).size > 1;
  const semCor = linhas.every(r => !r.cor);
  const celula = v => v === null || v === undefined ? `<td class="n mu">—</td>` : (v ? `<td class="n ${cls}">${fmt(v)}</td>` : `<td class="n mu">0</td>`);
  // totais por mês: soma só do que tem dado; estoque total é a soma dos estoques (do mês), venda total é a soma das vendas
  const totMes = {}; for (const m of colunas) { const vs = linhas.map(r => (r.meses[m] || {})[med]).filter(v => v !== null && v !== undefined); totMes[m] = vs.length ? vs.reduce((s, v) => s + v, 0) : null; }
  const totGeral = colunas.filter(m => cob.includes(m)).reduce((s, m) => s + (totMes[m] || 0), 0);
  let html = `<div class="card"><b>${fmt(totGeral)} ${med === "venda" ? "pares vendidos" : "pares em estoque (soma dos meses)"}</b> — ${linhas.length} produto(s) · AG de ${bases.map(dmy).join(" e ")}` +
             `<div class="seletor"><button data-med="venda" class="${med === "venda" ? "ativa" : ""}">venda</button><button data-med="estoque" class="${med === "estoque" ? "ativa" : ""}">estoque</button></div>` +
             `${avisos.length ? `<div class="msg aviso">${avisos.join("; ")}</div>` : ""}</div>`;
  html += `<div class="card" style="overflow-x:auto;padding:8px"><table><thead><tr>${muitosClientes ? "<th>cliente</th>" : ""}<th>ref.</th><th>nome</th>${semCor ? "" : "<th>cor</th>"}`;
  for (const m of colunas) html += `<th class="n">${mesBR(m)}</th>`;
  html += `<th class="n">${med === "venda" ? "total" : "último"}</th></tr></thead><tbody>`;
  for (const r of linhas) {
    html += `<tr>${muitosClientes ? `<td>${r.cliente}</td>` : ""}<td class="mu">${r.referencia}</td><td>${r.descricao}</td>${semCor ? "" : `<td>${r.cor}</td>`}`;
    let ultimo = null, total = 0;
    for (const m of colunas) {
      if (!cob.includes(m)) { html += `<td class="n mu">s/ carga</td>`; continue; }
      const v = (r.meses[m] || {})[med];
      html += celula(v === undefined ? null : v);
      if (v !== null && v !== undefined) { total += v; ultimo = v; }
    }
    // estoque não se soma no tempo: a última coluna mostra o ÚLTIMO estoque conhecido; venda soma
    html += celula(med === "venda" ? total : ultimo) + `</tr>`;
  }
  html += `<tr class="tot">${muitosClientes ? "<td></td>" : ""}<td colspan="${semCor ? 2 : 3}">total</td>`;
  for (const m of colunas) html += cob.includes(m) ? celula(totMes[m]) : `<td class="n">—</td>`;
  html += `<td class="n"></td></tr></tbody></table></div>`;
  $("resultado").innerHTML = html;
  for (const b of document.querySelectorAll(".seletor button")) b.onclick = () => { MEDIDA_GIRO = b.dataset.med; desenharGiro(); };
}
arranque();
