<!-- GESTOR — painel interno, v2.0 (TI, 25–30/09/2026). Aba METAS: desenho em metas.js, números do banco (v_meta_real,
     carta_real, v_carteira_faixa, v_decisao_vigente), visual aprovado por ele em 30/09. O nome é dele: "portal de consulta de carteira é UMA das coisas que vai ter
     dentro; vamos botar um nome que não bloqueia a mente". Só LEITURA.
     Publicado em repositório PÚBLICO (GitHub Pages): aqui só HTML/CSS/JS e a chave publicável — nada de segredo, caminho de
     máquina ou nome real de cliente em exemplo. Login com e-mail e senha (Auth do Supabase); sem login não vê nada.
     DUAS ABAS (ordem dele, 26/09): CARTEIRA (faturado + carteira por produto e mês, da base dele) e GIRO (venda e estoque por
     produto e mês, das análises de giro). Mesmos filtros; cada aba tem a sua cobertura de meses e diz quando não há carga —
     tabela vazia é armadilha. Mostra a data da base que gerou cada número.
     O que NÃO tem, de propósito: voz (o ditado do iPhone no campo já serve), qualquer escrita (cancelar/transferir é outro projeto),
     gráfico. Os marcadores https://bdkazfzgecbhmiewfmjb.supabase.co e sb_publishable_uR4m8_xLpYp-E3APKhzeHg_6gNOHuaB são preenchidos por publica_portal.py (a chave publicável é feita
     para ficar na página; o que protege o dado é a política por linha, não a chave). -->
<style>
/* tokens do Design System 'Visual CMS Olympikus' (PICASSO, 19/10/2026) — fonte única do visual; os nomes são os do sistema */
:root{--azul:#2E3EFC;--amarelo:#FFFF1A;--preto:#000;--cinza-escuro:#787B86;--cinza-claro:#ADAEB3;--off-white:#F6F5F0;--pagina:#E6E7E8;--cartao:#FFFFFF;--vermelho-ua:rgb(227,0,27);--raio-cartao:7px;--raio-selo:3px;--raio-chip:999px;--sombra-cartao:0 0.8px 2.3px rgba(0,0,0,0.12);--calha-celular:16px;--fonte-sans:Arial,Helvetica,sans-serif;--fonte-mono:"Courier New",monospace}
:root{--bg:var(--preto);--card:rgba(120,123,134,.14);--ink:var(--off-white);--mu:var(--cinza-claro);--acc:var(--amarelo);--ruim:var(--amarelo);--bd:rgba(120,123,134,.4);--ok:var(--amarelo)}

   sinal de 'bateu' nas barras e números: o dourado fica só na estrela (ícone), para não se confundir com o amarelo da marca. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:1.1rem;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
input,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:rgba(120,123,134,.1);color:var(--ink)}
.linha{display:flex;gap:10px}.linha>div{flex:1}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--preto);font-weight:800;margin-top:14px}
button.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:600}
.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:.95rem}
.msg.aviso{background:transparent;color:var(--cinza-claro);border:1px solid var(--cinza-escuro)}.msg.erro{background:var(--amarelo);color:var(--preto);font-weight:700}.msg.erro::before{content:"⚠ "}.msg.ok{background:rgba(120,123,134,.14);color:var(--amarelo)}  /* 12/10: a mensagem de passagem ('buscando…') no amarelo da casa, não no verde */
table{width:100%;border-collapse:collapse;margin-top:4px;font-size:.82rem}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--bd);vertical-align:top;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--acc)}
.mu{color:var(--mu);font-size:.8rem}
.pe{color:var(--mu);font-size:.75rem;margin-top:16px}
/* ordem dele (26/09, no celular): um número por célula, uma linha só; a COR diz o que é — verde claro = faturado, verde escuro = carteira */
td.fat{background:var(--azul);color:var(--off-white);font-weight:700}
td.cart{color:var(--amarelo);box-shadow:inset 3px 0 0 var(--amarelo)}
td.mix{background:linear-gradient(90deg,var(--azul) 50%,var(--amarelo) 50%);color:var(--off-white);font-weight:700}
/* giro: venda em verde claro (é venda), estoque em azul — cores diferentes para o olho não confundir com a carteira */
td.est{background:rgba(173,174,179,.28);color:var(--off-white);font-weight:700}
.legenda{font-size:.75rem;color:var(--mu);margin:6px 0 0}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 10px}
.oculto{display:none}
/* a lista de múltipla escolha (12/10): uma caixa que abre a lista com caixinhas de marcar */
.lista-sel{position:relative;display:inline-block}.lista-sel .painel{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:260px;max-height:60vh;overflow:auto;background:var(--preto);opacity:1;box-shadow:0 10px 30px rgba(0,0,0,.8);border:1px solid var(--cinza-escuro);border-radius:12px;padding:6px}
.lista-sel .painel button{display:flex;width:100%;align-items:center;gap:10px;margin:0;padding:10px 12px;background:transparent;border:0;border-radius:8px;color:var(--ink);font-weight:600;text-align:left;font-size:.9rem}
.lista-sel .painel button:hover{background:var(--cinza-escuro)}.lista-sel .painel button.ativa{background:var(--cinza-escuro);color:var(--amarelo)}
.lista-sel .painel button::before{content:"☐";font-size:1rem;width:18px}.lista-sel .painel button.ativa::before{content:"☑"}
/* v3.0 (12/10): a tabela de carteira e giro rola dentro do cartão; cabeçalho (2 linhas) e as colunas do produto ficam TRAVADOS */
.cg{max-height:72vh;overflow:auto;padding:0!important}
.cg table{border-collapse:separate;border-spacing:0}
.cg thead th{position:sticky;background:rgba(120,123,134,.22);z-index:3}.cg thead tr:first-child th{top:0}.cg thead tr.rotulos th{top:29px;font-size:.7rem;color:var(--mu);font-weight:600}
.cg th.fixa,.cg td.fixa{position:sticky;background:rgba(120,123,134,.14);z-index:2}.cg thead th.fixa{z-index:4}
.cg td.fixa.ref{left:0}.cg td.fixa.nome{left:var(--l1)}.cg td.fixa.cor{left:var(--l2)}.cg th.fixa.ref{left:0}.cg th.fixa.nome{left:var(--l1)}.cg th.fixa.cor{left:var(--l2)}
.cg td.fixa.cor,.cg th.fixa.cor{border-right:2px solid var(--cinza-escuro)}
.cg th.mes{text-align:center;border-left:2px solid var(--cinza-escuro);cursor:pointer;user-select:none}.cg td.ini{border-left:2px solid var(--cinza-escuro)}
.cg thead th.g{background:transparent;color:var(--off-white);box-shadow:inset 0 -2px 0 var(--azul)}.cg thead th.c{background:transparent;color:var(--amarelo);box-shadow:inset 0 -2px 0 var(--amarelo)}.cg thead tr.rotulos th.g{color:var(--cinza-claro)}.cg thead tr.rotulos th.c{color:var(--amarelo)}
.cg td.ct{color:var(--amarelo);box-shadow:inset 3px 0 0 var(--amarelo)}.cg td.ctf{background:var(--amarelo);color:var(--preto);font-weight:700}
/* coluna agrupada como no Excel: toca no mês, ele some e fica o símbolo; toca no símbolo, ele volta */
.cg th.col,.cg td.col{width:18px;min-width:18px;max-width:18px;padding:4px 2px!important;text-align:center;background:rgba(120,123,134,.26)}.cg thead th.col{color:var(--amarelo);font-weight:900;font-size:.95rem}.cg thead tr.rotulos th.col{font-size:.55rem;color:var(--mu);writing-mode:vertical-rl;transform:rotate(180deg);padding:2px 0!important}
.cg tr.tot td{position:sticky;bottom:0;background:rgba(120,123,134,.22)}
.cg button.mm{width:20px;height:20px;padding:0;margin:0 6px 0 0;border-radius:6px;background:rgba(120,123,134,.3);color:var(--ink);border:1px solid var(--cinza-escuro);font-weight:800;line-height:1;vertical-align:middle}
.cg tr.filha td{background:rgba(120,123,134,.1);font-size:.78rem}.cg tr.filha td.fixa{background:rgba(120,123,134,.1)}.cg tr.mae td{font-weight:600}
.cg tr.filha td.ctf,.cg tr.tot td.ctf{background:var(--amarelo);color:var(--preto)}.cg tr.filha td.ct{color:var(--amarelo)}
/* v5.67 (19/10, ele: "uma cópia fiel da análise de giro; o cabeçalho fica transparente quando rolo; os totais acima do cabeçalho") */
.cg{background:var(--off-white);color:var(--preto)}.cg table{color:var(--preto);font-size:.82rem}
.cg thead th{background:var(--cinza-claro);color:var(--preto);opacity:1}.cg thead tr:first-child th{top:0}.cg thead tr.rotulos th{background:var(--cinza-claro);color:var(--preto);font-weight:700}
.cg thead th.g,.cg thead tr.rotulos th.g{background:var(--cinza-claro);color:var(--preto);box-shadow:inset 0 -2px 0 var(--azul)}.cg thead th.c,.cg thead tr.rotulos th.c{background:var(--amarelo);color:var(--preto);box-shadow:none}
.cg th.fixa,.cg td.fixa{background:var(--off-white);color:var(--preto)}.cg thead th.fixa{background:var(--cinza-claro)}.cg td.fixa.ref.mu,.cg td.fixa.cor.mu,.cg td .mu,.cg td.mu{color:var(--cinza-escuro)}
.cg td{border-bottom:1px solid rgba(120,123,134,.25)}.cg td.est{background:var(--cinza-claro);color:var(--preto);font-weight:600}.cg td.fat{font-weight:600}
.cg td.ct{color:var(--preto);background:rgba(255,255,26,.35);box-shadow:none}.cg td.ctf{background:var(--amarelo);color:var(--preto)}.cg tr.filha td.ct{color:var(--preto)}
.cg th.col,.cg td.col{background:var(--cinza-claro)}.cg thead th.col{color:var(--preto)}.cg thead tr.rotulos th.col{color:var(--preto)}
.cg tr.filha td{background:rgba(173,174,179,.14);color:var(--preto)}.cg tr.filha td.fixa{background:rgba(226,227,229,1)}.cg tr.mae td{font-weight:600}
.cg button.mm{background:var(--off-white);color:var(--preto);border-color:var(--cinza-escuro)}
.cg thead tr.tot th{position:sticky;background:var(--preto);color:var(--off-white);font-weight:800;font-variant-numeric:tabular-nums;text-align:right;box-shadow:inset 0 -2px 0 var(--amarelo)}.cg thead tr.tot th.fixa{text-align:left;background:var(--preto);color:var(--amarelo)}.cg thead tr.tot th.ct,.cg thead tr.tot th.ctf{background:var(--amarelo);color:var(--preto)}.cg thead tr.tot th.col{background:var(--preto)}
.cg thead tr.tot th .cob{display:block;font-size:.66rem;font-weight:600;color:var(--cinza-claro)}.cg thead tr.tot th.ct .cob,.cg thead tr.tot th.ctf .cob{color:var(--preto)}

// ---------- a gravação do que é DELE na tela: observação (0059) e em linha (0060). Um upsert por campo, "salvo ✓" discreto, erro visível.
async function escritorioId(){ if (!FALE.esc) { const e = await sb.from("escritorio").select("id").limit(1); FALE.esc = (e.data && e.data[0] && e.data[0].id) || null; } return FALE.esc; }
const piscaSalvo = td => { const s = td && td.querySelector(".salvo"); if (!s) return; s.classList.add("on"); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove("on"), 2_000); };
async function gravarObs(inp){
  const k = inp.dataset.k, t = inp.value.trim();
  if (!UM_CLIENTE || t === (OBS[k] || "")) return;
  const [ref, cor] = k.split("|");
  const r = await sb.rpc("giro_observacao_grava", { p_escritorio: await escritorioId(), p_cliente: UM_CLIENTE, p_referencia: ref, p_cor: cor, p_texto: t });
  if (r.error) { inp.classList.add("erro"); msg("msg-pergunta", "O banco recusou a observação de " + esc(ref) + (cor ? " " + esc(cor) : "") + ": " + esc(r.error.message), "erro"); return; }

// o registro de produto_situacao (referência → em_linha; várias marcas na mesma referência = bool_and, como a cg_consulta): a base do "sem registro"
async function lerSituacao(){
  const r = await tudo(sb.from("produto_situacao").select("referencia,em_linha").order("escritorio_id").order("marca").order("referencia"));
  const mapa = new Map(); for (const x of r.data || []) mapa.set(x.referencia, mapa.has(x.referencia) ? mapa.get(x.referencia) && x.em_linha !== false : x.em_linha !== false);
  return { mapa, erro: r.error ? r.error.message : "" };
}
// o seletor tem 3 valores: sem registro (só exibição — o gravador não apaga linha, então depois de escolher sim/fora a opção some) · sim · fora
async function gravarEmLinha(sel){
  const ref = sel.dataset.ref, ant = sel.dataset.ant || "", v = sel.value;
  if (v !== "sim" && v !== "fora") return;                         // "sem registro" não grava nada
  const el = v === "sim"; sel.disabled = true;
  const r = await sb.rpc("produto_situacao_grava", { p_escritorio: await escritorioId(), p_marca: sel.dataset.marca || "", p_referencia: ref, p_em_linha: el });
  sel.disabled = false;
  if (r.error) { sel.value = ant; msg("msg-pergunta", "O banco recusou o em linha de " + esc(ref) + ": " + esc(r.error.message), "erro"); return; }
  sel.dataset.ant = v; sel.classList.remove("sem"); const sr = sel.querySelector('option[value=""]'); if (sr) sr.remove();
  if (ULTIMO) { const a = ULTIMO.linhas.find(x => x.referencia === ref); if (a) a.el = el; }
  for (const tr of document.querySelectorAll("#resultado tbody tr")) if (tr.dataset.ref === ref) { tr.classList.toggle("fora", !el); const f = tr.querySelector("td.fixa.el.mu"); if (f) f.textContent = el ? "" : "fora"; }

  };
  if (lista.length === 1) return abrir(lista[0]);
  luz.innerHTML = `<div class="quadro grade-quadro"><div class="gq-nome">Carteira de ${titulo}</div><div class="gq-perg">${lista.length ? "de qual cliente?" : "nenhum cliente na tela"}</div><div class="gq-botoes">${lista.map(c => `<button type="button" data-c="${esc(c)}">${esc(NOME_CLI[c] || c)}</button>`).join("")}</div><button type="button" class="sec gq-deixa">deixa</button></div>`;
  for (const b of luz.querySelectorAll(".gq-botoes button")) b.onclick = () => abrir(b.dataset.c);
  luz.querySelector(".gq-deixa").onclick = fecha;
}
// ---------- o AUTOFILTRO (ele, 20/10 01:0x: "igualzinho ao do Excel") é o da casa — GestorLib.autofiltro (gestor_lib.js), o mesmo da Carteira
// detalhada. Aqui só o que é da AG: os valores distintos de cada coluna (referência, nome, gênero e em linha são da mãe; cor é das cores;
// observação é das duas) e o redesenho. Vive em FILTROS (memória), nada persiste.
const AF = GestorLib.autofiltro({ filtros: FILTROS, nomeCol, ehNum, aplicar: () => { if (CG_ULT) desenharCG(CG_ULT.linhas, CG_ULT.pedidos, CG_ULT.bases); },
  valores: col => { const vs = []; for (const a of (CG_ULT ? CG_ULT.linhas : [])) { if (col !== "cor") vs.push(valorDe(a, col, null)); if (col === "cor" || col === "obs") for (const c of a.cores.values()) vs.push(valorDe(c, col, a)); } return vs; } });
arranque();
