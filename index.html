<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<!-- GESTOR — painel interno, v2.0 (TI, 25–30/09/2026). Aba METAS: desenho em metas.js, números do banco (v_meta_real,
     carta_real, v_carteira_faixa, v_decisao_vigente), visual aprovado por ele em 30/09. O nome é dele: "portal de consulta de carteira é UMA das coisas que vai ter
     dentro; vamos botar um nome que não bloqueia a mente". Só LEITURA.
     Publicado em repositório PÚBLICO (GitHub Pages): aqui só HTML/CSS/JS e a chave publicável — nada de segredo, caminho de
     máquina ou nome real de cliente em exemplo. Login com e-mail e senha (Auth do Supabase); sem login não vê nada.
     DUAS ABAS (ordem dele, 26/09): CARTEIRA (faturado + carteira por produto e mês, da base dele) e GIRO (venda e estoque por
     produto e mês, das análises de giro). Mesmos filtros; cada aba tem a sua cobertura de meses e diz quando não há carga —
     tabela vazia é armadilha. Mostra a data da base que gerou cada número.
     O que NÃO tem, de propósito: voz (o ditado do iPhone no campo já serve), qualquer escrita (cancelar/transferir é outro projeto),
     gráfico. Os marcadores https://bdkazfzgecbhmiewfmjb.supabase.co e sb_publishable_uR4m8_xLpYp-E3APKhzeHg_6gNOHuaB são preenchidos por publica_portal.py (a chave publicável é feita
     para ficar na página; o que protege o dado é a política por linha, não a chave). -->
<style>
:root{--bg:#151515;--card:#1C1C1C;--ink:#F2F2F2;--mu:#9A9A9A;--acc:#FFFF1A;--ruim:#d9534f;--bd:#2C2C2C;--ok:#30E07A}
/* v2.6 (12/10): as cores da CMS — AMARELO #FFFF1A (Amarelo Olympikus, PMS 102C) e PRETO #151515 (o preto do chat dele). O verde --ok é o único
   sinal de 'bateu' nas barras e números: o dourado fica só na estrela (ícone), para não se confundir com o amarelo da marca. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:1.1rem;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
input,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#111111;color:var(--ink)}
.linha{display:flex;gap:10px}.linha>div{flex:1}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#151515;font-weight:800;margin-top:14px}
button.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:600}
.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:.95rem}
.msg.aviso{background:#3a2a10;color:#ffd54a}.msg.erro{background:#3a1616;color:#ff9a9a}.msg.ok{background:#2A2A10;color:#FFFF1A}  /* 12/10: a mensagem de passagem ('buscando…') no amarelo da casa, não no verde */
table{width:100%;border-collapse:collapse;margin-top:4px;font-size:.82rem}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--bd);vertical-align:top;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:800;border-top:2px solid var(--acc)}
.mu{color:var(--mu);font-size:.8rem}
.pe{color:var(--mu);font-size:.75rem;margin-top:16px}
/* ordem dele (26/09, no celular): um número por célula, uma linha só; a COR diz o que é — verde claro = faturado, verde escuro = carteira */
td.fat{background:#245c3d;color:#dff5e7;font-weight:700}
td.cart{background:#0f3a24;color:#9be7b8}
td.mix{background:linear-gradient(90deg,#245c3d 50%,#0f3a24 50%);color:#dff5e7;font-weight:700}
/* giro: venda em verde claro (é venda), estoque em azul — cores diferentes para o olho não confundir com a carteira */
td.est{background:#1f3d5c;color:#d6e8ff;font-weight:700}
.legenda{font-size:.75rem;color:var(--mu);margin:6px 0 0}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 10px}
.oculto{display:none}
/* a lista de múltipla escolha (12/10): uma caixa que abre a lista com caixinhas de marcar */
.lista-sel{position:relative;display:inline-block}.lista-sel .painel{position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:240px;max-height:60vh;overflow:auto;background:#1C1C1C;border:1px solid #3A3A3A;border-radius:12px;padding:6px}
.lista-sel .painel button{display:flex;width:100%;align-items:center;gap:10px;margin:0;padding:10px 12px;background:transparent;border:0;border-radius:8px;color:var(--ink);font-weight:600;text-align:left;font-size:.9rem}
.lista-sel .painel button:hover{background:#262626}.lista-sel .painel button.ativa{background:#262626;color:#FFFF1A}
.lista-sel .painel button::before{content:"☐";font-size:1rem;width:18px}.lista-sel .painel button.ativa::before{content:"☑"}
/* v3.0 (12/10): a tabela de carteira e giro rola dentro do cartão; cabeçalho (2 linhas) e as colunas do produto ficam TRAVADOS */
.cg{max-height:72vh;overflow:auto;padding:0!important}
.cg table{border-collapse:separate;border-spacing:0}
.cg thead th{position:sticky;background:#202020;z-index:3}.cg thead tr:first-child th{top:0}.cg thead tr:nth-child(2) th{top:29px;font-size:.7rem;color:var(--mu);font-weight:600}
.cg th.fixa,.cg td.fixa{position:sticky;background:#1C1C1C;z-index:2}.cg thead th.fixa{z-index:4}
.cg td.fixa.ref{left:0}.cg td.fixa.nome{left:var(--l1)}.cg td.fixa.cor{left:var(--l2)}.cg th.fixa.ref{left:0}.cg th.fixa.nome{left:var(--l1)}.cg th.fixa.cor{left:var(--l2)}
.cg td.fixa.cor,.cg th.fixa.cor{border-right:2px solid #3A3A3A}
.cg th.mes{text-align:center;border-left:2px solid #3A3A3A;cursor:pointer;user-select:none}.cg td.ini{border-left:2px solid #3A3A3A}
.cg thead th.g{background:#1E2A24;color:#9be7b8}.cg thead th.c{background:#2E2214;color:#FFC98A}.cg thead tr:nth-child(2) th.g{color:#7fbf9a}.cg thead tr:nth-child(2) th.c{color:#d9a46a}
.cg td.ct{background:#4A2E12;color:#FFD9B0}.cg td.ctf{background:#7A4A1A;color:#FFE8CF;font-weight:700}
/* coluna agrupada como no Excel: toca no mês, ele some e fica o símbolo; toca no símbolo, ele volta */
.cg th.col,.cg td.col{width:18px;min-width:18px;max-width:18px;padding:4px 2px!important;text-align:center;background:#262626}.cg thead th.col{color:#FFFF1A;font-weight:900;font-size:.95rem}.cg thead tr:nth-child(2) th.col{font-size:.55rem;color:var(--mu);writing-mode:vertical-rl;transform:rotate(180deg);padding:2px 0!important}
.cg tr.tot td{position:sticky;bottom:0;background:#202020}
.cg button.mm{width:20px;height:20px;padding:0;margin:0 6px 0 0;border-radius:6px;background:#2C2C2C;color:var(--ink);border:1px solid #3A3A3A;font-weight:800;line-height:1;vertical-align:middle}
.cg tr.filha td{background:#181818;font-size:.78rem}.cg tr.filha td.fixa{background:#181818}.cg tr.mae td{font-weight:600}
/* abas e o seletor venda/estoque: botões pequenos, lado a lado */
.abas,.seletor{display:flex;gap:8px;margin:0 0 12px}
.abas button,.seletor button{margin:0;padding:10px;background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:700}
.abas button.ativa,.seletor button.ativa{background:var(--acc);color:#151515;border-color:var(--acc)}
.seletor{margin:10px 0 0}.seletor button{padding:8px;font-size:.85rem}
/* ordem dele (28/09): filtro de cliente por NOME, um toque — nada de digitar no celular */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.chips button{width:auto;margin:0;padding:9px 12px;border-radius:999px;background:transparent;color:var(--ink);border:1px solid var(--bd);font-weight:600;font-size:.85rem}
.chips button.ativa{background:var(--acc);color:#151515;border-color:var(--acc)}
/* ---- METAS: o visual aprovado por ele em 30/09 (BOSS; canvas "Revisão · celular" e "Revisão · computador"). Cores e medidas
   são as do desenho; o que é regra está no cabeçalho de metas.js. Painel escuro, fonte Sora. ---- */
.mt{--cf:#4C8DFF;--cp:#3A67B0;--vf:#3EE6A0;--vp:#2B9C7A;--ouro:#F2B632;--prata:#C9D1DC;--txt:#F2F2F2;--mut:#9A9A9A;--eixo:#3A3A3A;--l100:#7A7A7A;--mm:#8A8A8A;--rot:#9A9A9A;
    background:#151515;color:var(--txt);font-family:'Sora',system-ui,sans-serif;margin:0 -16px;padding:4px 0 8px 16px;display:flex;flex-direction:column;gap:24px}
.mt .rot{font-size:12px;letter-spacing:.14em;color:var(--rot);font-weight:600;margin-bottom:12px}
.mt .sec{display:flex;flex-direction:column}.mt .sec.fam,.mt .leg,.mt .pe{padding-right:16px}
.mt .rolo{overflow-x:auto;-webkit-overflow-scrolling:touch}.mt .fila{display:flex;align-items:stretch;width:max-content;padding-right:16px}
/* o cartão do TOTAL: roxo, separado, barras e linha de 100% próprias, números maiores */
.mt .tot{width:158px;flex-shrink:0;margin-right:26px;padding:14px 12px 14px;border-radius:18px;background:#1C1C1C;border:1.5px solid #FFFF1A;display:flex;flex-direction:column}
.mt .tot .nm{font-size:12px;font-weight:800;letter-spacing:.12em;color:#FFFF1A;min-height:0}
.mt .tot .st{margin-top:6px;gap:14px}.mt .tot .st .s{width:18px;height:18px}
.mt .tot .bars{height:200px;gap:8px;border-bottom-color:#4A4A4A}.mt .tot .l100{left:-2px;right:-2px;border-color:#9A9A9A}
/* 12/10: no total, duas linhas — 90% tracejada (gatilho) e 100% contínua (a meta, a mesma das faixas); rótulo pequeno na ponta */
.mt .l100.forte{border-top:2.5px solid #F2F2F2}.mt .l100.cem{border-top:1.5px dashed #C8C8C8}.mt .l100 .lr{position:absolute;right:0;top:-12px;font-size:8px;color:var(--mut);font-weight:700}.mt .tot .l100 .lr{font-size:9px;color:#C8C8C8}
/* a travessia dos 100%: uma linha tracejada só, do total até a última faixa (posicionada por alinhar100 na altura da linha do total) */
.mt .fila{position:relative}.mt .fila .atravessa{position:absolute;left:0;right:0;border-top:1.5px dashed #C8C8C8;pointer-events:none;z-index:1}.mt .fx .l100{opacity:0}
.mt .tot .b{width:34px;border-radius:6px 6px 0 0}.mt .tot .b.c{background:var(--cf)}.mt .tot .b.v{background:var(--vf)}
.mt .tot .g{font-size:22px;font-weight:800}.mt .tot .g.c{color:#B9C9FF}.mt .tot .g.v{color:#8FF5CF}.mt .tot .m{color:#9A9A9A}
.mt .trava{margin-top:12px;padding-top:10px;border-top:1px solid #4E43A8;display:flex;flex-direction:column;gap:6px}
.mt .trava .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.08em;color:#D9D3FF}.mt .trava .tl b{font-size:15px;font-weight:800;color:#fff}
.mt .trava .tb{position:relative;height:6px;border-radius:3px;background:#3A3175}.mt .trava .tb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#7BF0C4}
.mt .t15{display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;margin-right:16px;border-radius:16px;background:#1C1C1C;border:1px solid #2C2C2C}
.mt .t15 .rot{margin-bottom:0}
.mt .t15 .lin{display:grid;grid-template-columns:86px 1fr 112px;gap:6px 10px;align-items:center}
.mt .t15 .lin .nm{font-size:11px;font-weight:700;letter-spacing:.08em;color:#FFFF1A}
.mt .t15 .trk{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px 0}
.mt .t15 .trk .tb{position:relative;height:10px;border-radius:5px;background:#2C2C2C;display:flex;overflow:hidden}
.mt .t15 .trk .tb i{display:block;height:100%;flex:0 0 auto;animation:cresce 1.3s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* a barra dos 15% é a COMPOSIÇÃO (12/10, 2ª rodada dele: "as cores ficaram muito próximas"): tênis Olympikus = azul Olympikus #2E3EFC
   (a META, a referência), Under Armour = vermelho da marca, e cada família numa cor fácil de distinguir */
.mt .f-FTW{background:#2E3EFC}.mt .f-MEOLY{background:#FFFF1A}.mt .f-CHOLY{background:#FF8A00}.mt .f-ACOLY{background:#B06CFF}.mt .f-CFOLY{background:#2EC4E6}.mt .f-UA{background:#E3001B}
/* visão do gestor (12/10): uma barra por vendedor, lado a lado, em cada cartão; nome e % embaixo de cada barra */
.mt.cmpv .tot{width:auto;min-width:0}.mt.cmpv .bars{gap:4px;align-items:flex-end;margin-bottom:36px}
/* 13:1x: a coluna de cada vendedor é uma área de altura cheia; a barra é absoluta no pé (altura --h), a estrela no topo dela, os rótulos FORA (abaixo da área) —
   antes os rótulos empurravam a barra e a Mari (76%) aparecia acima dos 90% */
.mt.cmpv .pb{position:relative;height:100%;min-width:0;flex:1}
.mt.cmpv .pb .b{position:absolute;bottom:0;left:0;right:0;margin:0 auto}
.mt.cmpv .pb .s{position:absolute;left:0;right:0;margin:0 auto;bottom:calc(var(--h) + 3px)}
.mt.cmpv .pb .pn{position:absolute;top:100%;left:0;right:0;text-align:center;margin-top:5px}.mt.cmpv .pb .pp{position:absolute;top:100%;left:0;right:0;text-align:center;margin-top:18px}
.mt.cmpv .pb .b{width:100%;max-width:14px;min-width:6px}.mt.cmpv.tri .pb{flex:1}.mt.cmpv.tri .pb.pc{flex:1}.mt.cmpv.tri .pb.pc .b{max-width:18px}.mt.cmpv.tri .pb.sep{margin-left:10px}.mt.cmpv.tri .pb .s.prata svg path{fill:var(--prata)}.mt.cmpv .pb.pc{flex:1.6}.mt.cmpv .pb.pc .b{max-width:30px}.mt.cmpv .pb .s{width:10px;height:10px}.mt.cmpv .pb .pn{font-size:9px;font-weight:700;color:var(--mut);overflow:hidden;white-space:nowrap}.mt.cmpv .pb.pc .pn{color:#B9C9FF}
.mt.cmpv .pb .pp{font-size:9px;font-weight:700;color:var(--txt)}.mt.cmpv .fx{width:200px}.mt.cmpv .tot{width:230px}.mt.cmpv .fms{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){.mt.cmpv .fx{width:auto}.mt.cmpv .tot{width:300px}.mt.cmpv .pb .pn{font-size:9px}.mt.cmpv .fms{grid-template-columns:repeat(var(--n),minmax(0,1fr))}}
.mt .t15 .fp{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--mut);margin-top:-4px}.mt .t15 .fp span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.mt .t15 .fp i{display:inline-block;width:8px;height:8px;border-radius:2px}
.mt .t15 .trk .mk{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed #C8C8C8;z-index:1}.mt .t15 .trk .mk.ok{border-color:var(--ouro)}
.mt .t15 .val{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--mut);line-height:1.25}.mt .t15 .val b{font-size:16px;font-weight:800;color:#fff}.mt .t15 .val b.ok{color:var(--ouro)}.mt .t15 .val .c{color:var(--rot)}
.mt .t15 .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10px;color:var(--rot);margin-top:2px}.mt .t15 .lg span{display:flex;align-items:center;gap:5px}
.mt .t15 .lg i{display:inline-block;width:10px;height:10px;border-radius:3px}.mt .t15 .lg i.mk{width:0;height:12px;border-left:2px dashed #C8C8C8;border-radius:0}
/* as faixas: um cartão por faixa, na fila; três tons */
.mt .fxs{display:flex;gap:10px}
.mt .fx{width:108px;flex-shrink:0;min-width:0;display:flex;flex-direction:column;padding:14px 10px 12px;border-radius:16px;background:#1C1C1C;border:1px solid #2C2C2C}
.mt .fx.foco{background:#222222;border-color:#FFFF1A}
.mt .nm{font-size:12px;line-height:1.3;min-height:32px;font-weight:400}.mt .fx.foco .nm{font-weight:800}.mt .fx.abandonado .nm{color:var(--mut)}
.mt .st{height:18px;display:flex;justify-content:center;gap:12px}
.mt .s{display:inline-block;width:16px;height:16px;opacity:0}.mt .s svg{width:100%;height:100%;display:block}.mt .s.on{opacity:1}.mt .s svg path{fill:var(--ouro);stroke:#7A4E00;stroke-width:1.2}.mt .s.prata svg path{fill:var(--prata);stroke:#6B6B6B}
.mt .bars{position:relative;height:186px;display:flex;align-items:flex-end;justify-content:center;gap:6px;border-bottom:1px solid var(--eixo)}
.mt .l100{position:absolute;left:-4px;right:-4px;bottom:66.67%;border-top:1.5px dashed var(--l100)}
.mt .rot100{position:absolute;right:0;top:-14px;font-size:9px;color:#ff9a9a;font-weight:700;white-space:nowrap}
.mt .b{width:24px;border-radius:5px 5px 0 0;transform-origin:bottom;animation:sobe 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.mt .fx .b.c{background:var(--cp)}.mt .fx .b.v{background:var(--vp)}.mt .fx.foco .b.c{background:var(--cf)}.mt .fx.foco .b.v{background:var(--vf)}
.mt .fx.abandonado .b{background:#9A9A9A!important;opacity:.7}   /* abandonada = cinza (ele, 12/10 14:3x) */
.mt .b.ouro{background:var(--ouro)!important}
.mt .b.vazia{border-top:2px dotted var(--mut);height:0}
.mt .num{display:flex;flex-direction:column;min-width:0}.mt .cel{display:flex;flex-direction:column;min-width:0}
.mt .g{font-size:16px;font-weight:700;margin-top:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.mt .cel.v .g{margin-top:6px}
.mt .m{font-size:11px;color:var(--mm);white-space:nowrap}.mt .m.fat{font-size:10px}
.mt .fx .g.c{color:#8FA9D6}.mt .fx.foco .g.c{color:#7FAEFF}.mt .fx.abandonado .g.c{color:var(--mut)}
.mt .fx .g.v{color:#7CC9AE}.mt .fx.foco .g.v{color:#5CF0B4}.mt .fx.abandonado .g.v{color:var(--mut)}
.mt .fx .g.ok{color:var(--ouro)}
/* outras famílias em R$: bloco próprio, tons padrão */
.mt .fms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mt .fm{display:flex;flex-direction:column;padding:12px 6px 10px;border-radius:14px;background:#1C1C1C;border:1px solid #2C2C2C;min-width:0}
.mt .fm .nm{font-size:11px;font-weight:600;min-height:16px}.mt .fm .st{height:16px;margin-top:2px}.mt .fm .st .s{width:14px;height:14px}
.mt .fm .bars{height:130px;margin-top:8px;gap:5px}.mt .fm .l100{left:-2px;right:-2px}
.mt .fm .b{width:18px;border-radius:4px 4px 0 0}.mt .fm .b.c{background:var(--cp)}.mt .fm .b.v{background:var(--vp)}
.mt .fm .g{font-size:13px;margin-top:8px}.mt .fm .cel.v .g{margin-top:4px}.mt .fm .m{font-size:10px}
.mt .fm .g.c{color:#8FA9D6}.mt .fm .g.v{color:#4ADE9C}.mt .fm .g.ok{color:var(--ouro)}
.mt .leg{display:flex;flex-wrap:wrap;gap:12px 16px;font-size:11px;color:var(--rot)}.mt .leg span{display:flex;align-items:center;gap:6px}
.mt .leg .q{width:10px;height:10px;border-radius:3px;display:inline-block}.mt .leg .q.c{background:var(--cf)}.mt .leg .q.v{background:var(--vf)}.mt .leg .s{width:13px;height:13px}
.mt .pe{color:var(--rot);font-size:11px;margin:0}
/* o seletor de mês: segmentado, como no desenho */
.segm{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:4px;border-radius:14px;background:#1C1C1C;margin:0 0 14px}
.segm button{height:44px;border:0;border-radius:10px;background:transparent;color:#C4CAD4;font-family:'Sora',system-ui,sans-serif;font-size:14px;font-weight:600;margin:0;padding:0;width:auto}
.segm button.ativa{background:#FFFF1A;color:#151515;font-weight:800}.segm .longo{display:none}
/* computador: total à esquerda com 48px até as faixas; faixas em grade; famílias alinhadas sob as faixas */
@media (min-width:900px){

<script>
const URL_SB = "https://bdkazfzgecbhmiewfmjb.supabase.co", CHAVE = "sb_publishable_uR4m8_xLpYp-E3APKhzeHg_6gNOHuaB";
const sb = supabase.createClient(URL_SB, CHAVE);
const $ = id => document.getElementById(id);
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_LONGOS = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
const fmt = n => Number(n).toLocaleString("pt-BR");
const mesBR = iso => { const [a,m] = iso.slice(0,7).split("-"); return MESES[+m-1] + "/" + a.slice(2); };
const dmy = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
// texto do banco ou de erro NUNCA entra em HTML sem passar pelo esc (achado 3 do Conselho, 06/10) — gestor_lib.js
const esc = GestorLib.esc;
function msg(id, texto, tipo){ $(id).innerHTML = texto ? `<div class="msg ${tipo||"aviso"}">${texto}</div>` : ""; }
function mostrar(tela){ for (const t of ["tela-login","tela-senha","tela-pergunta"]) $(t).classList.toggle("oculto", t !== tela); }

// ---------- sessão
async function arranque(){
  const hash = new URLSearchParams(location.hash.slice(1));
  const { data: { session } } = await sb.auth.getSession();
  if (session && (hash.get("type") === "invite" || hash.get("type") === "recovery")) { mostrar("tela-senha"); return; }
  if (session) { mostrar("tela-pergunta"); await prepararPergunta(); return; }
  mostrar("tela-login");
}
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === "PASSWORD_RECOVERY") mostrar("tela-senha");
  else if (evento === "SIGNED_OUT") mostrar("tela-login");
});
$("bt-entrar").onclick = async () => {
  msg("msg-login", "");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  if (error) { msg("msg-login", "Não entrou: " + esc(traduz(error.message)), "erro"); return; }
  mostrar("tela-pergunta"); await prepararPergunta();
};
$("bt-esqueci").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) { msg("msg-login", "Escreva o e-mail primeiro.", "aviso"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
  msg("msg-login", error ? "Não consegui: " + esc(traduz(error.message)) : "Se o e-mail tiver login, chegou um link para definir a senha.", error ? "erro" : "ok");
};
$("bt-definir").onclick = async () => {
  const s = $("senha-nova").value;
  if (s.length < 8) { msg("msg-senha", "Mínimo 8 caracteres.", "erro"); return; }
  const { error } = await sb.auth.updateUser({ password: s });
  if (error) { msg("msg-senha", "Não salvou: " + esc(traduz(error.message)), "erro"); return; }
  history.replaceState(null, "", location.pathname);
  mostrar("tela-pergunta"); await prepararPergunta();
};
$("bt-sair").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); mostrar("tela-login"); };
function traduz(m){ return ({"Invalid login credentials":"e-mail ou senha errados","Email not confirmed":"e-mail ainda não confirmado"})[m] || m; }

// ---------- as abas
// Cada aba tem a sua fonte, a sua cobertura de meses e o seu rodapé. Os filtros são os mesmos.
const ABAS = {
  cg:    { subtitulo: "· carteira e giro", rodape: "Por mês: V = venda do cliente (sellout) · E = estoque do cliente · C = carteira da base dele, em laranja (laranja claro = o mês já tem faturado dentro). — = o banco não tem o dado; 0 = zero." },
  metas: { subtitulo: "· metas", rodape: "" },        // nenhum texto explicativo na tela (ATA 23/09)
};
// cobertura de meses de cada fonte (lida do banco no arranque); erro = cobertura DESCONHECIDA, não vazia
const COB = { carteira: [], giro: [], erro: null };
let MES_METAS = null, PREPOSTO_METAS = null, PREPOSTOS = null, MARCA_METAS = "OLY", VER_VENDEDORES = false;
// rótulo do seletor: mês por extenso (ou curto no celular); "AAAA-Tn" = o trimestre somado (12/10: "3º TRI 26", "4º TRI 26")
const rotMes = (m, longo) => { const t = /^(\d{4})-T(\d)$/.exec(m); if (t) return longo ? `${t[2]}º TRI ${t[1].slice(2)}` : `${t[2]}ºT`; return longo ? MESES_LONGOS[+m.slice(5,7)-1] : MESES[+m.slice(5,7)-1].toUpperCase(); };
// 12/10, ordem dele: a aba Metas para cada vendedor e para a CMS completa — um chip por preposto (nomes da tabela preposto;
// TODOS = a CMS inteira), na ordem fixa por geografia (Metas.ORDEM_PREP). Visão do gestor: abre na CMS completa; "ver vendedores"
// mostra uma barra por vendedor, lado a lado. OLYMPIKUS / UNDER ARMOUR na mesma página.
async function listarPrepostos(){
  if (PREPOSTOS) return PREPOSTOS;
  const { data } = await sb.from("preposto").select("preposto,nome,ordem").order("ordem");
  PREPOSTOS = (data || []).map(p => ({ preposto: p.preposto, nome: p.preposto === "TODOS" ? "CMS" : p.nome, ordem: p.ordem }));   // 12/10: "bota só CMS"
  return PREPOSTOS;
}
async function mostrarMetas(){
  const el = $("metas-painel"); el.innerHTML = `<div class="msg ok">buscando…</div>`;
  const ps = await listarPrepostos();
  if (!PREPOSTO_METAS) PREPOSTO_METAS = (ps[0] || {}).preposto || null;
  // 12/10: o botão "ver vendedores" vive dentro da visão CMS — ao lado das colunas da CMS entram as barras pequenas de cada vendedor
  const naCms = PREPOSTO_METAS === "TODOS";
  $("chips-preposto").innerHTML = ps.map(p => `<button type="button" data-preposto="${p.preposto}" class="${p.preposto === PREPOSTO_METAS ? "ativa" : ""}">${esc(p.nome)}</button>`).join("") +
    (naCms ? `<button type="button" id="ver-vendedores" class="${VER_VENDEDORES ? "ativa" : ""}" style="border-style:dashed">${VER_VENDEDORES ? "esconder vendedores" : "ver vendedores"}</button>` : "") +
    `<span style="flex-basis:100%"></span>` +
    ["OLY", "UA"].map(m => `<button type="button" data-marca="${m}" class="${m === MARCA_METAS ? "ativa" : ""}">${m === "OLY" ? "OLYMPIKUS" : "UNDER ARMOUR"}</button>`).join("");
  for (const b of document.querySelectorAll("#chips-preposto button[data-preposto]")) b.onclick = () => { PREPOSTO_METAS = b.dataset.preposto; mostrarMetas(); };
  for (const b of document.querySelectorAll("#chips-preposto button[data-marca]")) b.onclick = () => { MARCA_METAS = b.dataset.marca; mostrarMetas(); };
  if (naCms) $("ver-vendedores").onclick = () => { VER_VENDEDORES = !VER_VENDEDORES; mostrarMetas(); };
  if (naCms && VER_VENDEDORES) {
    const tq = /^(\d{4})-T(\d)$/.exec(MES_METAS || "");
    if (tq) {                                              // trimestre no comparativo: um bloco por mês, cada um pela sua meta (nada se soma)
      const mm = [1, 2, 3].map(i => tq[1] + "-" + String((+tq[2]) * 3 - 3 + i).padStart(2, "0"));
      const blocos = await Promise.all(mm.map(m => Metas.carregarTodos(sb, m, MARCA_METAS, ps)));
      const meses = (blocos[0][0] && blocos[0][0].meses) || [];
      $("chips-mes").innerHTML = meses.map(m => `<button type="button" data-mes="${m}" class="${m === MES_METAS ? "ativa" : ""}"><span class="longo">${rotMes(m, true)}</span><span class="cur">${rotMes(m, false)}</span></button>`).join("");
      for (const b of document.querySelectorAll("#chips-mes button")) b.onclick = () => { MES_METAS = b.dataset.mes; mostrarMetas(); };
      el.innerHTML = mm.map((m, i) => `<div id="cmp-${i}"></div>`).join("");
      blocos.forEach((b, i) => Metas.desenharComparativo($("cmp-" + i), b));
      return;
    }
    const ds = await Metas.carregarTodos(sb, MES_METAS, MARCA_METAS, ps);
    const meses = (ds[0] && ds[0].meses) || [];
    $("chips-mes").innerHTML = meses.map(m => `<button type="button" data-mes="${m}" class="${m === ((ds[0] && ds[0].mes) || MES_METAS) ? "ativa" : ""}"><span class="longo">${rotMes(m, true)}</span><span class="cur">${rotMes(m, false)}</span></button>`).join("");
    for (const b of document.querySelectorAll("#chips-mes button")) b.onclick = () => { MES_METAS = b.dataset.mes; mostrarMetas(); };
    Metas.desenharComparativo(el, ds);
    return;
  }
  const d = await Metas.carregar(sb, MES_METAS, PREPOSTO_METAS, MARCA_METAS);
  const meses = d.meses || [];
  // SET · OUT · NOV · DEZ, abrindo no mês corrente (pedido dele, 29/09); à frente é carteira, não real
  $("chips-mes").innerHTML = meses.map(m => `<button type="button" data-mes="${m}" class="${m === (d.mes || MES_METAS) ? "ativa" : ""}"><span class="longo">${rotMes(m, true)}</span><span class="cur">${rotMes(m, false)}</span></button>`).join("");
  for (const b of document.querySelectorAll("#chips-mes button")) b.onclick = () => { MES_METAS = b.dataset.mes; mostrarMetas(); };
  Metas.desenhar(el, d);
}
let ABA = "cg";
function trocarAba(nova){
  ABA = nova;
  for (const b of document.querySelectorAll(".abas button")) b.classList.toggle("ativa", b.dataset.aba === nova);
  $("subtitulo").textContent = ABAS[nova].subtitulo;
  $("rodape").textContent = ABAS[nova].rodape;
  $("resultado").innerHTML = ""; msg("msg-pergunta", "");
  const metas = nova === "metas";
  $("tela-metas").classList.toggle("oculto", !metas); $("filtros").classList.toggle("oculto", metas); $("resultado").classList.toggle("oculto", metas);
  if (metas) { mostrarMetas(); return; }
  mostrarCobertura(); consultar();
}
for (const b of document.querySelectorAll(".abas button")) b.onclick = () => trocarAba(b.dataset.aba);
function mostrarCobertura(){
  if (COB.erro) { $("cobertura").textContent = "não consegui ler a cobertura (" + COB.erro + ") — recarregue a página; sem a cobertura não respondo"; return; }
  $("cobertura").textContent = "carteira: " + (COB.carteira.map(mesBR).join(", ") || "sem carga") + " · giro: " + (COB.giro.map(mesBR).join(", ") || "sem carga");
}
// A API devolve no máximo 1.000 linhas por pedido, EM SILÊNCIO (26/09: set–dez "sumiram"). Tudo se lê em páginas até acabar.
async function tudo(consulta){
  const PAG = 1000; let de = 0, out = [];
  for (;;) {
    const { data, error } = await consulta.range(de, de + PAG - 1);
    if (error) return { data: out, error };
    out = out.concat(data || []);
    if (!data || data.length < PAG) return { data: out, error: null };
    de += PAG;
  }
}
// ---------- famílias (marca · família) e subfamílias: os códigos vêm de duas fontes com grafias diferentes; aqui vira UM nome
const FAMILIAS = ["OLY FOOTWEAR", "OLY CHINELO", "OLY MEIAS", "OLY ACESSÓRIOS", "OLY CONFECÇÃO", "UA FOOTWEAR", "UA CHINELO", "UA MEIAS", "UA ACESSÓRIOS", "UA CONFECÇÃO"];
function familiaDe(marca){
  const t = String(marca || "").toUpperCase().replace(/[_\s]+/g, " ").trim();
  if (!t) return "";
  if (t === "OLY" || t === "FTW" || /OLY FTW/.test(t)) return "OLY FOOTWEAR";
  if (/CHOLY|OLY CHI/.test(t)) return "OLY CHINELO";
  if (/MEOLY|OLY MEI/.test(t)) return "OLY MEIAS";
  if (/ACOLY|OLY ACC|ACC OLY/.test(t)) return "OLY ACESSÓRIOS";
  if (/CFOLY|OLY VEST|OLY APP|OLY CONF/.test(t)) return "OLY CONFECÇÃO";
  if (/UA TN|UA FTW/.test(t)) return "UA FOOTWEAR";
  if (/UA CH/.test(t)) return "UA CHINELO";
  if (/UA ME/.test(t)) return "UA MEIAS";
  if (/UA AC/.test(t)) return "UA ACESSÓRIOS";
  if (/UA APP|UA CF|UA CONF/.test(t)) return "UA CONFECÇÃO";
  return t;
}
const SUBS = { "OLY FOOTWEAR": ["CLASSICOS", "CONF_FEM", "CONF_MASC", "CORRIDA/TREINO", "INFANTIL", "CORRE"], "UA FOOTWEAR": ["RUNNING", "TRAINING", "RUN INSPIRED", "BASKETBALL"] };
const NOME_SUB = { "CLASSICOS": "CLÁSSICOS", "CONF_FEM": "CONF. FEMININO", "CONF_MASC": "CONF. MASCULINO", "CORRIDA/TREINO": "CORRIDA TREINO", "INFANTIL": "INFANTIL", "CORRE": "CORRE" };
// nomes de exibição dos clientes (cadastro, como ele fala); o que não estiver aqui aparece como está no banco
const NOME_CLI = { "BANBAN CALCADOS": "Ban Ban", "CASA PIO": "Casa Pio", "LOJAS NOROESTE": "Noroeste", "POLYELLE": "Polyélle", "SAPATARIA NOVA": "Sapataria Nova" };
let CLIENTE_SEL = new Set(), FAMILIA_SEL = new Set(), SUB_SEL = new Set(), CLIENTES = [], MESES_DISP = [], MESES_SEL = new Set();   // conjuntos: múltipla escolha (12/10)
let ABERTO_CLI = false, TODOS_CLI = false;       // a lista abre pela setinha; TODOS_CLI = ele escolheu "todos" (a página abre ZERADA: nada escolhido = nada consultado, 12/10)
document.addEventListener("DOMContentLoaded", () => {
  $("abre-clientes").onclick = (ev) => { ev.stopPropagation(); ABERTO_CLI = !ABERTO_CLI; montarChips(); };
  document.addEventListener("click", (ev) => { if (ABERTO_CLI && !ev.target.closest(".lista-sel")) { ABERTO_CLI = false; montarChips(); } });   // clicou fora: fecha
});
async function prepararPergunta(){
  const nomes = new Set();
  for (const [k, visao] of [["carteira", "v_cobertura"], ["giro", "v_cobertura_giro"]]) {
    const { data: cob, error } = await tudo(sb.from(visao).select("cliente,mes").order("mes").order("cliente"));
    if (error) { COB.erro = String(error.message || error); COB[k] = []; continue; }
    for (const r of cob || []) nomes.add(r.cliente);
    COB[k] = [...new Set((cob || []).map(r => r.mes.slice(0, 7)))].sort();
  }
  CLIENTES = [...nomes].sort();
  // os meses que existem no banco (carteira ou giro) viram caixinhas; no arranque todos ligados (12/10: "múltipla escolha, clique liga, clique desliga")
  MESES_DISP = [...new Set([...COB.carteira, ...COB.giro])].sort();
  if (!MESES_SEL.size) for (const m of MESES_DISP) MESES_SEL.add(m);
  montarChips();
  trocarAba(ABA);
}
// os botões de filtro (12/10): cliente, família e subfamília; um toque escolhe e a tabela já muda — sem botão "perguntar"
// caixinhas de múltipla escolha: toque liga, toque desliga; "todos/todas" (valor vazio) limpa o conjunto e fica aceso quando nada está escolhido
function chips(id, lista, sel){
  $(id).innerHTML = lista.map(([v, r]) => `<button type="button" data-v="${esc(v)}" class="${(v === "" ? !sel.size : sel.has(v)) ? "ativa" : ""}">${esc(r)}</button>`).join("");
  return [...document.querySelectorAll("#" + id + " button")];
}
const liga = (sel, v) => { if (v === "") sel.clear(); else if (sel.has(v)) sel.delete(v); else sel.add(v); };
function montarChips(){
  for (const b of chips("chips-cliente", [["", "todos"], ...CLIENTES.map(c => [c, NOME_CLI[c] || c])], CLIENTE_SEL)) b.onclick = (ev) => { ev.stopPropagation(); if (b.dataset.v === "") { TODOS_CLI = !TODOS_CLI; CLIENTE_SEL.clear(); } else { TODOS_CLI = false; liga(CLIENTE_SEL, b.dataset.v); } montarChips(); consultar(); };
  const bt = $("chips-cliente").querySelector('button[data-v=""]'); if (bt) bt.classList.toggle("ativa", TODOS_CLI);
  const sel = [...CLIENTE_SEL].map(c => NOME_CLI[c] || c);
  $("abre-clientes").textContent = (sel.length ? (sel.length <= 2 ? sel.join(" + ") : sel.length + " clientes") : (TODOS_CLI ? "todos" : "escolha o cliente")) + (ABERTO_CLI ? " ▴" : " ▾");
  $("chips-cliente").classList.toggle("oculto", !ABERTO_CLI);
  for (const b of chips("chips-familia", [["", "todas"], ...FAMILIAS.map(f => [f, f])], FAMILIA_SEL)) b.onclick = () => { liga(FAMILIA_SEL, b.dataset.v); for (const x of [...SUB_SEL]) if (!subsDisponiveis().includes(x)) SUB_SEL.delete(x); montarChips(); consultar(); };
  $("chips-meses").innerHTML = MESES_DISP.map(m => `<button type="button" data-m="${m}" class="${MESES_SEL.has(m) ? "ativa" : ""}">${mesBR(m)}</button>`).join("");
  for (const b of document.querySelectorAll("#chips-meses button")) b.onclick = () => { const m = b.dataset.m; if (MESES_SEL.has(m)) MESES_SEL.delete(m); else MESES_SEL.add(m); montarChips(); consultar(); };
  const subs = subsDisponiveis();
  $("bloco-sub").classList.toggle("oculto", !subs.length);
  for (const b of chips("chips-sub", [["", "todas"], ...subs.map(x => [x, NOME_SUB[x] || x])], SUB_SEL)) b.onclick = () => { liga(SUB_SEL, b.dataset.v); montarChips(); consultar(); };
}
// as subfamílias aparecem quando algum FOOTWEAR está escolhido (como no BI): as de cada marca escolhida
const subsDisponiveis = () => [...FAMILIA_SEL].flatMap(f => SUBS[f] || []);
function mesesEntre(de, ate){
  const out = []; let [a,m] = de.split("-").map(Number); const [a2,m2] = ate.split("-").map(Number);
  while (a < a2 || (a === a2 && m <= m2)) { out.push(a + "-" + String(m).padStart(2,"0")); m++; if (m > 12) { m = 1; a++; } }
  return out;
}
function periodo(){
  if (COB.erro) { msg("msg-pergunta", "A cobertura não foi lida (" + esc(COB.erro) + "). Não digo que não há carga: não sei. Recarregue a página.", "erro"); return null; }
  const pedidos = [...MESES_SEL].sort();
  if (!pedidos.length) { msg("msg-pergunta", "Nenhum mês ligado: toque num mês.", "aviso"); return null; }
  return { de: pedidos[0], ate: pedidos[pedidos.length - 1], pedidos };
}
// ---------- CARTEIRA E GIRO numa tabela só (12/10, 2ª rodada dele): como na AG — por mês de giro VENDA · ESTOQUE · COBERTURA, e as
// CARTEIRAS depois, mês a mês; linhas AGRUPADAS por referência (a linha-mãe soma as cores; o +/− abre as cores); o filtro de
// cliente consolida o que estiver escolhido (sem coluna de cliente).
const FAM_CURTA = { "OLY FOOTWEAR": "FTW", "OLY CHINELO": "CHINELO", "OLY MEIAS": "MEIAS", "OLY ACESSÓRIOS": "ACESS", "UA FOOTWEAR": "UA FTW", "UA CHINELO": "UA CHIN", "UA MEIAS": "UA MEIAS", "UA ACESSÓRIOS": "UA ACESS", "OLY CONFECÇÃO": "CONF", "UA CONFECÇÃO": "UA CONF" };
const SUB_CURTA = { "CLASSICOS": "CLÁSSICO", "CONF_FEM": "CONF FEM", "CONF_MASC": "CONF MASC", "CORRIDA/TREINO": "CORRIDA TREINO", "INFANTIL": "INFANTIL", "CORRE": "CORRE", "RUNNING": "RUNNING", "TRAINING": "TRAINING", "RUN INSPIRED": "RUN INSP", "BASKETBALL": "BASKET" };
const famCurta = (fam, sub) => sub ? (SUB_CURTA[sub] || sub) : (FAM_CURTA[fam] || fam || "");
let CONSULTA_N = 0, ABERTOS = new Set(), COLAPSADOS = new Set();   // COLAPSADOS: meses escondidos como no agrupar do Excel
async function consultar(){
  if (ABA !== "cg") return;
  msg("msg-pergunta", ""); $("resultado").innerHTML = "";
  const p = periodo(); if (!p) return;
  const { de, ate, pedidos } = p, n = ++CONSULTA_N;
  if (!TODOS_CLI && !CLIENTE_SEL.size) { msg("msg-pergunta", "Escolha o cliente na caixinha (um, vários ou todos). A página abre vazia de propósito: assim ela abre na hora.", "aviso"); return; }
  msg("msg-pergunta", "buscando…", "ok");
  const t0 = performance.now();
  // UMA chamada (12/10, "está mais lento que o BI"): a função cg_consulta devolve já por referência+cor, meses dentro — antes eram
  // dezenas de páginas de 1.000 linhas e cada página refazia a soma inteira no banco
  const r = await sb.rpc("cg_consulta", { p_clientes: TODOS_CLI ? null : [...CLIENTE_SEL], p_de: de + "-01", p_ate: ate + "-01" });
  if (n !== CONSULTA_N) return;                                   // outro toque veio depois: este resultado já envelheceu
  if (r.error) { msg("msg-pergunta", "O banco recusou: " + esc(r.error.message), "erro"); return; }
  msg("msg-pergunta", "");
  const dados = r.data || { linhas: [] };
  // a linha-mãe é a REFERÊNCIA (soma de todas as cores e de todos os clientes filtrados); as filhas são as cores
  const maes = new Map();
  const mae = x => { let a = maes.get(x.referencia); if (!a) { a = { referencia: x.referencia, descricao: x.descricao || "", fam: familiaDe(x.marca), sub: x.faixa || "", meses: {}, cores: new Map(), venda: 0, cart: 0, fat: 0 }; maes.set(x.referencia, a); }
    if (!a.descricao && x.descricao) a.descricao = x.descricao; if (!a.fam) a.fam = familiaDe(x.marca); if (!a.sub && x.faixa) a.sub = x.faixa; return a; };
  const soma = (alvo, m, campo, v) => { if (v == null) return; const c = alvo.meses[m] || (alvo.meses[m] = {}); c[campo] = (c[campo] || 0) + v; alvo[campo] = (alvo[campo] || 0) + v; };
  const CAMPOS = { f: "fat", c: "cart", v: "venda", e: "estoque" };
  for (const x of dados.linhas) { const a = mae(x), f = { cor: x.cor || "", meses: {}, venda: 0, cart: 0, fat: 0 }; a.cores.set(f.cor, f);
    for (const [m, c] of Object.entries(x.meses || {})) for (const [k, campo] of Object.entries(CAMPOS)) { soma(a, m, campo, c[k]); soma(f, m, campo, c[k]); } }
  const bases = new Set(); if (dados.base_venda) bases.add("base " + dmy(dados.base_venda)); if (dados.base_giro) bases.add("AG " + dmy(dados.base_giro));
  bases.add((Math.round(performance.now() - t0) / 1000).toFixed(1).replace(".", ",") + " s");
  let linhas = [...maes.values()];
  if (FAMILIA_SEL.size) linhas = linhas.filter(a => FAMILIA_SEL.has(a.fam));
  if (SUB_SEL.size) linhas = linhas.filter(a => SUB_SEL.has(a.sub));
  linhas.sort((x, y) => (y.venda || 0) - (x.venda || 0) || ((y.cart || 0) + (y.fat || 0) - (x.cart || 0) - (x.fat || 0)));
  if (!linhas.length) { msg("msg-pergunta", `Nenhum produto para ${esc([...CLIENTE_SEL].map(c => NOME_CLI[c] || c).join(", ") || "todos")} · ${esc([...FAMILIA_SEL].join(", ") || "todas as famílias")}${SUB_SEL.size ? " · " + esc([...SUB_SEL].map(x => SUB_CURTA[x] || x).join(", ")) : ""} em ${pedidos.map(mesBR).join(", ")}.`, "aviso"); return; }
  desenharCG(linhas, pedidos, [...bases].sort());
}
function desenharCG(linhas, pedidos, bases){
  const mesesGiro = pedidos.filter(m => COB.giro.includes(m)), mesesCart = pedidos.filter(m => COB.carteira.includes(m));
  const semDado = `<td class="n mu">—</td>`;
  const cel = (v, cls) => v == null ? semDado : (v ? `<td class="n ${cls}">${fmt(v)}</td>` : `<td class="n mu">0</td>`);
  // cobertura do mês = estoque ÷ venda do mês (em meses); sem venda, não há cobertura
  const cob = (c) => (c.estoque == null || !c.venda) ? semDado : `<td class="n mu">${(c.estoque / c.venda).toFixed(1).replace(".", ",")}</td>`;
  const celC = c => { const fat = c.fat || 0, cart = c.cart || 0, v = fat + cart; if (!v) return `<td class="n mu">0</td>`; return `<td class="n ${fat ? "ctf" : "ct"}">${fmt(v)}</td>`; };
  const fechada = `<td class="col"></td>`;
  const celulas = (x, cls) => { let h = ""; for (const m of mesesGiro) { if (COLAPSADOS.has("g" + m)) { h += fechada; continue; } const c = x.meses[m] || {}; h += cel(c.venda, "fat").replace('class="n', 'class="n ini') + cel(c.estoque, "est") + cob(c); } for (const m of mesesCart) { if (COLAPSADOS.has("c" + m)) { h += fechada; continue; } const c = x.meses[m] || {}; h += celC(c).replace('class="n', 'class="n ini'); } return h; };
  const tot = { meses: {} }; for (const a of linhas) for (const [m, c] of Object.entries(a.meses)) { const t = tot.meses[m] || (tot.meses[m] = {}); for (const k of ["venda", "estoque", "fat", "cart"]) if (c[k] != null) t[k] = (t[k] || 0) + c[k]; }
  const nCores = linhas.reduce((s, a) => s + a.cores.size, 0);
  let html = `<div class="card"><b>${linhas.length} referência(s)</b> · ${nCores} linha(s) por cor · ${esc(bases.join(" · "))}<div class="legenda"><i style="background:#245c3d"></i>venda (giro) <i style="background:#1f3d5c"></i>estoque · cob = estoque ÷ venda do mês <i style="background:#4A2E12"></i>carteira <i style="background:#7A4A1A"></i>carteira com faturado · toque no mês para esconder a coluna; toque no + para trazer de volta</div></div>`;
  html += `<div class="card cg"><table><thead><tr><th class="fixa ref">ref.</th><th class="fixa nome">nome</th><th class="fixa cor">cor</th>`;
  const cabMes = (m, cls, span) => COLAPSADOS.has(cls + m) ? `<th class="mes col ${cls}" data-m="${cls + m}" title="mostrar ${mesBR(m)}">+</th>` : `<th class="mes ${cls}" data-m="${cls + m}" colspan="${span}" title="esconder ${mesBR(m)}">${mesBR(m)}</th>`;
  for (const m of mesesGiro) html += cabMes(m, "g", 3);
  for (const m of mesesCart) html += cabMes(m, "c", 1);
  html += `</tr><tr><th class="fixa ref"></th><th class="fixa nome"></th><th class="fixa cor"></th>`;
  for (const m of mesesGiro) html += COLAPSADOS.has("g" + m) ? `<th class="col g">${mesBR(m)}</th>` : `<th class="n ini g">venda</th><th class="n g">estoque</th><th class="n g">cob</th>`;
  for (const m of mesesCart) html += COLAPSADOS.has("c" + m) ? `<th class="col c">${mesBR(m)}</th>` : `<th class="n ini c">cart</th>`;
  html += `</tr></thead><tbody>`;
  for (const a of linhas) {
    const aberto = ABERTOS.has(a.referencia), varias = a.cores.size > 1 || (a.cores.size === 1 && a.cores.keys().next().value !== "");
    html += `<tr class="mae"><td class="fixa ref mu">${varias ? `<button type="button" class="mm" data-ref="${esc(a.referencia)}">${aberto ? "−" : "+"}</button>` : ""}${esc(a.referencia)}</td><td class="fixa nome">${esc(a.descricao)}</td><td class="fixa cor mu">${a.cores.size > 1 ? "todas" : esc(a.cores.keys().next().value || "")}</td>${celulas(a)}</tr>`;
    if (aberto) for (const f of [...a.cores.values()].sort((x, y) => (y.venda || 0) - (x.venda || 0))) html += `<tr class="filha"><td class="fixa ref"></td><td class="fixa nome mu"></td><td class="fixa cor">${esc(f.cor) || "<span class='mu'>sem cor</span>"}</td>${celulas(f)}</tr>`;
  }
  html += `<tr class="tot"><td class="fixa ref">total</td><td class="fixa nome"></td><td class="fixa cor"></td>${celulas(tot)}</tr></tbody></table></div>`;
  $("resultado").innerHTML = html;
  for (const b of document.querySelectorAll("#resultado button.mm")) b.onclick = () => { const r = b.dataset.ref; if (ABERTOS.has(r)) ABERTOS.delete(r); else ABERTOS.add(r); desenharCG(linhas, pedidos, bases); };
  for (const th of document.querySelectorAll("#resultado th.mes")) th.onclick = () => { const m = th.dataset.m; if (COLAPSADOS.has(m)) COLAPSADOS.delete(m); else COLAPSADOS.add(m); desenharCG(linhas, pedidos, bases); };
  // as colunas travadas precisam saber a largura das vizinhas (ref → nome → cor)
  const t = $("resultado").querySelector("table"), w = cls => { const th = t.querySelector("thead th.fixa." + cls); return th ? th.getBoundingClientRect().width : 0; };
  t.style.setProperty("--l1", w("ref") + "px"); t.style.setProperty("--l2", (w("ref") + w("nome")) + "px");
}
arranque();
